<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ashford candidates</title>
<style>
body{font:16px system-ui,sans-serif;max-width:640px;margin:2rem auto;padding:0 16px;background:#fafafa;color:#222}
.c{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px 16px;margin:12px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.l{font-size:2rem;font-weight:700;width:2rem}audio{flex:1;min-width:220px}
select,textarea,button{font:inherit}textarea{width:100%;height:5rem}
@media(prefers-color-scheme:dark){body{background:#181818;color:#eee}.c{background:#222;border-color:#444}}
</style></head><body>
<h1>Ashford: pick a voice</h1>
<p>Each clip says the same line. Rank 1 (best) to 6, or leave "-" to reject. Ranks are kept in this browser.
Open from <code>spikes/tts-bakeoff/listen.html</code> with the <code>candidates/</code> folder beside it.</p>
<div id="list"></div>
<textarea id="notes" placeholder="Notes (what you liked or disliked)"></textarea>
<p><button id="copy">Copy ranking</button> <span id="out"></span></p>
<script>
const L="ABCDEF".split("");
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const list=document.getElementById("list");
L.forEach(x=>{
 const d=document.createElement("div");d.className="c";
 d.innerHTML=`<span class="l">${x}</span><audio controls preload="none" src="candidates/${x}.mp3"></audio>
 <label>Rank <select id="r${x}"><option>-</option>${[1,2,3,4,5,6].map(n=>`<option>${n}</option>`).join("")}</select></label>`;
 list.appendChild(d);
 const s=d.querySelector("select");s.value=store.get("r"+x)||"-";
 s.onchange=()=>{store.set("r"+x,s.value);show()};
});
const notes=document.getElementById("notes");notes.value=store.get("notes")||"";
notes.oninput=()=>{store.set("notes",notes.value);show()};
document.addEventListener("play",e=>{document.querySelectorAll("audio").forEach(a=>{if(a!==e.target)a.pause()})},true);
function text(){
 const r=L.map(x=>[x,document.getElementById("r"+x).value]).filter(p=>p[1]!="-").sort((a,b)=>a[1]-b[1]);
 return "Ranking: "+(r.map(p=>p[1]+"="+p[0]).join(", ")||"none")+(notes.value?"\nNotes: "+notes.value:"");
}
function show(){document.getElementById("out").textContent=text().split("\n")[0]}
document.getElementById("copy").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(text()).catch(()=>{});show()};
show();
</script></body></html>
